name: Bug report
description: Something does not work
labels: [bug]
body:
  - type: textarea
    id: what
    attributes: { label: What happened, description: What did you expect instead? }
    validations: { required: true }
  - type: input
    id: env
    attributes: { label: "Browser, version and OS (host and viewer)" }
    validations: { required: true }
  - type: textarea
    id: steps
    attributes: { label: Steps to reproduce }
