name: Deploy site
# Runs only after a maintainer merges to main. Pull requests never deploy.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: pnpm/setup@v3
        with:
          package-json-file: web/package.json   # reads "packageManager" (set it in web/package.json)
          runtime: node@26
          cache: true
          cache-dependency-path: web/pnpm-lock.yaml
          install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
        env:
          PUBLIC_SIGNAL_URL: ${{ vars.SIGNAL_URL }}
      - uses: actions/upload-pages-artifact@v3
        with: { path: web/dist }
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
